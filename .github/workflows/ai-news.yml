name: AI News Daily Report

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = JST 08:00 毎朝
  workflow_dispatch:       # 手動実行ボタンも有効化

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install anthropic feedparser requests python-dotenv

      - name: Run report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ai_news_report.py